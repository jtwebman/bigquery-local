name: Publish

# Release-driven: publishing a GitHub Release (which also creates the tag)
# triggers this workflow. The tag must match `package.json` version exactly
# — otherwise the workflow fails fast before any image is pushed.
#
# Cut a release with the auto-generated changelog:
#   gh release create v0.1.0 --generate-notes --title "v0.1.0"
# or via the UI at https://github.com/jtwebman/bigquery-local/releases/new.

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required so `npm publish --provenance` can mint an OIDC token and the
  # registry can record a signed attestation of the build environment.
  id-token: write

env:
  # See ci.yml for context.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE: jtwebman/bigquery-local

jobs:
  docker:
    name: Docker Hub publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify git tag matches package.json version
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG"
          echo "git tag:      v$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match package.json version $PKG. Bump package.json and re-tag."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          # Cache layers across runs to speed up tag-only changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: npm publish
    runs-on: ubuntu-latest
    # Only after Docker is up, so Docker Hub and npm are always in lockstep —
    # if one fails the other doesn't ship either.
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        # Auth via npm Trusted Publishers (OIDC) — no NPM_TOKEN secret.
        # The package's Trusted Publishers config on npmjs.com names this
        # repo + workflow file; npm verifies the GitHub OIDC token at
        # publish time. `id-token: write` (above) is what allows that.
        # `--provenance` attaches a signed attestation tied to this run.
        # `--access public` is required because npm defaults to private
        # on the first publish of an unscoped package created via Actions.
        run: npm publish --provenance --access public
