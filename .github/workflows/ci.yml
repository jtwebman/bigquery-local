name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Force the JS runtime that bundled GitHub Actions use internally
  # (actions/checkout, actions/setup-node, …) to Node 24. Node 20 is
  # deprecated and forced off June 2, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Node 24.16.0 has intermittently hung on event-loop teardown (a libuv /
    # isolate handle leak), running to the 6h default. `--test-force-exit` (in
    # the test scripts) handles the normal case; this caps a genuinely wedged
    # job so it fails fast instead of burning a runner for hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Pin Node 24 to an explicit patch (24.16.0 — released 2026-05-21)
        # rather than `'24'` because the GitHub runner image's bundled
        # cache lags by several patches. Windows + Node 24.15.0 hit a
        # node:test bug where `before()` hooks could fail silently,
        # marking the test file ✖ with no subtest error. Fixed in
        # 24.16.0 ("test_runner: fix suite rerun edge case" +
        # "fix failing suite hooks when marked with todo").
        node: ['24.16.0', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Node 24.16.0 leaks an event-loop handle on teardown and hangs after the
      # suite finishes. `--test-force-exit` makes the runner exit once tests +
      # hooks complete. It's applied everywhere EXCEPT Windows, where it races
      # node:test's per-file child-process teardown and spuriously fails a file
      # ("test failed" with no failing subtest). Windows relies on the job
      # timeout-minutes backstop instead.
      - name: Test with coverage
        if: runner.os != 'Windows'
        run: npm run test:coverage -- --test-force-exit

      - name: Test with coverage (Windows)
        if: runner.os == 'Windows'
        run: npm run test:coverage

  python-client:
    name: Python client (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = oldest version still in bugfix support (EOL Oct 2027).
        # 3.14 = current stable (released 2026-05-10).
        # Bump these as Python's support window slides.
        python: ['3.11', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: test/clients/python/requirements.txt

      - name: Install Python deps
        run: pip install -r test/clients/python/requirements.txt

      - name: Run Python client tests
        run: pytest test/clients/python/ -v

  go-client:
    name: Go client (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 = current released stable. 1.26 = latest. The Go BQ
        # client supports a wide window — bump as Go's support window
        # slides forward.
        go: ['1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: test/clients/go/go.sum

      - name: Run Go client tests
        working-directory: test/clients/go
        run: go test -v ./...

  java-client:
    name: Java client (${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 = older LTS still widely deployed. 25 = current LTS.
        java: ['17', '25']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Run Java client tests
        working-directory: test/clients/java
        run: mvn -B test

  bq-client:
    name: bq CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      # Installs the Google Cloud SDK, which bundles the `bq` CLI. No auth is
      # configured: the test fakes a static access token the emulator ignores.
      - name: Setup gcloud (provides bq)
        uses: google-github-actions/setup-gcloud@v2

      - name: Run bq CLI tests
        run: bash test/clients/bq/run.sh

  dbt-client:
    name: dbt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/clients/dbt/requirements.txt

      - name: Install dbt-bigquery
        run: pip install -r test/clients/dbt/requirements.txt

      - name: Run dbt conformance tests
        run: bash test/clients/dbt/run.sh
