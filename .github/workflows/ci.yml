name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Force the JS runtime that bundled GitHub Actions use internally
  # (actions/checkout, actions/setup-node, …) to Node 24. Node 20 is
  # deprecated and forced off June 2, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Pin Node 24 to an explicit patch (24.16.0 — released 2026-05-21)
        # rather than `'24'` because the GitHub runner image's bundled
        # cache lags by several patches. Windows + Node 24.15.0 hit a
        # node:test bug where `before()` hooks could fail silently,
        # marking the test file ✖ with no subtest error. Fixed in
        # 24.16.0 ("test_runner: fix suite rerun edge case" +
        # "fix failing suite hooks when marked with todo").
        node: ['24.16.0', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

  python-client:
    name: Python client (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = oldest version still in bugfix support (EOL Oct 2027).
        # 3.14 = current stable (released 2026-05-10).
        # Bump these as Python's support window slides.
        python: ['3.11', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: test/clients/python/requirements.txt

      - name: Install Python deps
        run: pip install -r test/clients/python/requirements.txt

      - name: Run Python client tests
        run: pytest test/clients/python/ -v

  go-client:
    name: Go client (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 = current released stable. 1.26 = latest. The Go BQ
        # client supports a wide window — bump as Go's support window
        # slides forward.
        go: ['1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: test/clients/go/go.sum

      - name: Run Go client tests
        working-directory: test/clients/go
        run: go test -v ./...
